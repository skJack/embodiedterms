<title>具身智能新手名词表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
:root{
  --ground:#EEF1F0; --panel:#F8FAF9; --ink:#17201E; --muted:#5B6863; --faint:#8A9691;
  --line:#D3DAD7; --accent:#1D5C6B; --accent-soft:#DCEAEC; --must:#F2C230; --must-ink:#3A2E00;
  --mark:#FFE9A3;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --display:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121816; --panel:#182020; --ink:#E4EAE7; --muted:#9AA7A2; --faint:#6E7B76;
    --line:#2A3431; --accent:#7CC3D1; --accent-soft:#1D3237; --must:#E5B82A; --must-ink:#241C00;
    --mark:#5A4A12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121816; --panel:#182020; --ink:#E4EAE7; --muted:#9AA7A2; --faint:#6E7B76;
  --line:#2A3431; --accent:#7CC3D1; --accent-soft:#1D3237; --must:#E5B82A; --must-ink:#241C00;
  --mark:#5A4A12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.7 var(--cjk);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
/* all:unset 会把 box-sizing 也重置成 content-box，这里统一补回来，避免按钮比容器宽 */
.btn{all:unset;box-sizing:border-box;cursor:pointer}

.shell{max-width:1240px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:40px}
header.top{grid-column:1/-1;padding-block:36px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px}
header.top h1{font:900 clamp(28px,4vw,40px)/1.15 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
header.top .meta{font:500 13px/1.5 var(--mono);color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
header.top .meta b{color:var(--ink);font-weight:600}
.lede{grid-column:1/-1;margin:0;max-width:68ch;color:var(--muted)}
.lede strong{color:var(--ink)}

nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow-x:hidden;overflow-y:auto;padding-block:8px 24px}
nav.rail .btn{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:baseline;gap:6px;width:100%;padding:5px 10px;border-radius:6px;color:var(--muted);font-size:14px;line-height:1.5}
nav.rail .btn:hover{color:var(--ink);background:var(--panel)}
nav.rail .btn[aria-pressed="true"]{color:var(--ink);background:var(--accent-soft);font-weight:600}
nav.rail .no{font:500 11.5px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
nav.rail .n{font:500 12px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
nav.rail .stage{font-size:11.5px;color:var(--faint);letter-spacing:.06em;padding:12px 10px 2px}

main{min-width:0;padding-bottom:80px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px;color:var(--muted)}
.search input{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:10px 0;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search kbd{font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.tiers{display:flex;gap:6px;flex-wrap:wrap}
.tiers .btn{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.tiers .btn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.tiers .tn{font:500 11px var(--mono);color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.tiers.off .btn{opacity:.45}
.tiers .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.count{font:500 12px var(--mono);color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}

.chips{display:none}

section.cat{padding-top:30px}
.cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cat-head .cno{font:600 14px var(--mono);color:var(--accent)}
.cat-head h2{font:900 26px/1.3 var(--display);margin:0}
.cat-head .n{font:500 13px var(--mono);color:var(--faint)}
.cat-blurb{margin:4px 0 12px;color:var(--muted);max-width:66ch}
ol.route{list-style:none;margin:0 0 6px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px}
ol.route a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink);font-size:14px;padding:3px 0}
ol.route a:hover .t{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
ol.route .sno{font:500 12px var(--mono);color:var(--faint)}
ol.route .n{font:500 11.5px var(--mono);color:var(--faint)}

.sec{scroll-margin-top:84px}
.sec > h3{margin:30px 0 0;font:700 19px/1.4 var(--display);display:flex;gap:10px;align-items:baseline}
.sec > h3 .sno{font:600 13px var(--mono);color:var(--accent)}
.sec > .sec-blurb{margin:2px 0 6px;color:var(--muted);font-size:14px;max-width:66ch}

article.term{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:16px 0;border-top:1px solid var(--line);scroll-margin-top:84px}
article.term:target,article.term.hit{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin-inline:-12px;padding-inline:12px;border-radius:6px}
.where{font-size:12px;color:var(--faint)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.head h4{margin:0;font:700 18px/1.35 var(--display)}
.head .en{font:500 13.5px/1.4 var(--mono);color:var(--muted)}
.head .ab{font:600 12px/1 var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:3px 6px}
.tier{font-size:11.5px;line-height:1;padding:4px 8px;border-radius:999px;margin-left:auto;white-space:nowrap}
.tier.t1{background:var(--must);color:var(--must-ink);font-weight:700}
.tier.t2{border:1px solid var(--line);color:var(--muted)}
.tier.t3{border:1px dashed var(--line);color:var(--faint)}
.one{margin:2px 0 0;font-weight:600;max-width:64ch}
.exp{margin:0;max-width:66ch;color:var(--ink)}
.ex{margin:0;max-width:66ch;color:var(--muted);font-size:14px}
.ex::before{content:"例子　";color:var(--faint)}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:6px;font-size:13px;color:var(--faint)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a,.rel span{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--muted)}
.rel a{color:var(--accent)}
.rel a:hover{border-color:var(--accent)}
.src a{color:var(--faint);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.src a:hover{color:var(--accent)}
.aka{color:var(--faint)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:60px 0;color:var(--muted)}
.next{margin-top:36px;display:flex;justify-content:flex-end}
.next .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 16px;display:grid;gap:2px;text-align:right}
.next .btn:hover{border-color:var(--accent)}
.next .k{font-size:12px;color:var(--faint)}
.next .v{font:700 16px var(--display);color:var(--ink)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  nav.rail{display:none}
  .bar{position:static}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:6px 2px;width:100%}
  .chips .btn{white-space:nowrap;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .chips .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
  .chips .no{font:500 11px var(--mono);color:var(--faint);margin-right:4px}
  .count{margin-left:0}
  .tier{margin-left:0}
  .sec,article.term{scroll-margin-top:12px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="shell">
  <header class="top">
    <h1>具身智能新手名词表</h1>
    <div class="meta" id="meta"></div>
  </header>
  <p class="lede" id="lede"></p>

  <nav class="rail" id="rail" aria-label="分类"></nav>

  <main>
    <div class="bar">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="搜中文、英文或缩写，如 VLA / 逆运动学 / 宇树" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="tiers" id="tiers" role="group" aria-label="分级"></div>
      <div class="chips" id="chips" role="group" aria-label="分类"></div>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </main>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/π/g, "pi");
const TIER = {1:"入门必知", 2:"常用", 3:"进阶"};
// 学习路线的四个阶段（按类别序号划分）
const STAGES = [[0, "先建立地图"], [1, "认识机器人本体"], [6, "工具与仿真"], [8, "怎么学：数据、训练、模型"], [12, "谁在做、怎么说"]];
const byId = Object.fromEntries(DATA.terms.map(t => [t.id, t]));
const catIdx = Object.fromEntries(DATA.cats.map((c, i) => [c.key, i]));
const state = {cat: "all", tier: "1", q: ""};
try { const s = JSON.parse(localStorage.getItem("glossary-view") || "{}"); if (s.tier) state.tier = s.tier; } catch (e) {}

const n1 = DATA.terms.filter(t => t.tier === 1).length;
$("#meta").innerHTML = `<span><b>${DATA.terms.length}</b> 条</span><span><b>${DATA.cats.length}</b> 类</span><span>事实截至 <b>${DATA.today}</b></span>`;
$("#lede").innerHTML = `给刚入门具身智能的同学查词用。14 类按学习顺序排：先认识机器人本体（形态、零件、怎么动、怎么控制、怎么感知），再看工具和仿真，然后是数据、训练和模型，最后是公司和行业说法；每类内部也分成由浅入深的小节。默认只列 <strong>入门必知</strong> 的 ${n1} 条，搜索时不受分级限制。`;

function buildRail(){
  let html = `<button type="button" class="btn" data-cat="all"><span class="no"></span><span>全部</span><span class="n"></span></button>`;
  DATA.cats.forEach((c, i) => {
    const st = STAGES.find(s => s[0] === i);
    if (st) html += `<div class="stage">${st[1]}</div>`;
    html += `<button type="button" class="btn" data-cat="${c.key}"><span class="no">${i + 1}</span><span>${esc(c.name)}</span><span class="n"></span></button>`;
  });
  $("#rail").innerHTML = html;
  $("#chips").innerHTML = `<button type="button" class="btn" data-cat="all">全部</button>` +
    DATA.cats.map((c, i) => `<button type="button" class="btn" data-cat="${c.key}"><span class="no">${i + 1}</span>${esc(c.name)}</button>`).join("");
}
buildRail();
function pickCat(key){ state.cat = key; render(); window.scrollTo({top: 0}); }
for (const el of [$("#rail"), $("#chips")]) el.addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) pickCat(b.dataset.cat); });

const tierN = k => k === "all" ? DATA.terms.length : DATA.terms.filter(t => t.tier <= Number(k)).length;
$("#tiers").innerHTML = [["1","入门必知","var(--must)"],["2","入门 + 常用","var(--accent)"],["all","全部",""]]
  .map(([k, l, c]) => `<button type="button" class="btn" data-tier="${k}">${c ? `<span class="dot" style="background:${c}"></span>` : ""}${l}<span class="tn">${tierN(k)}</span></button>`).join("");
$("#tiers").addEventListener("click", e => { const b = e.target.closest("[data-tier]"); if (!b) return; state.tier = b.dataset.tier; try { localStorage.setItem("glossary-view", JSON.stringify({tier: state.tier})); } catch (e) {} render(); });

const HAY = Object.fromEntries(DATA.terms.map(t => [t.id, norm([t.name_zh, t.name_en, t.abbr, ...(t.aliases || []), t.one_liner, t.explanation].join(" "))]));
const NAMEHAY = Object.fromEntries(DATA.terms.map(t => [t.id, norm([t.name_zh, t.name_en, t.abbr, ...(t.aliases || [])].join(" "))]));

function hl(text, q){
  const s = esc(text); if (!q) return s;
  const i = norm(text).indexOf(q); if (i < 0) return s;
  const raw = String(text);
  return esc(raw.slice(0, i)) + "<mark>" + esc(raw.slice(i, i + q.length)) + "</mark>" + esc(raw.slice(i + q.length));
}

function termHTML(t, q){
  const en = t.name_en && norm(t.name_en) !== norm(t.name_zh) ? `<span class="en">${hl(t.name_en, q)}</span>` : "";
  const ab = t.abbr && ![norm(t.name_zh), norm(t.name_en)].includes(norm(t.abbr)) ? `<span class="ab">${hl(t.abbr, q)}</span>` : "";
  const rel = (t.related || []).map((r, i) => { const id = (t.related_ids || [])[i]; return id && byId[id] && id !== t.id ? `<a href="#${id}" data-jump="${id}">${esc(byId[id].name_zh)}</a>` : `<span>${esc(r)}</span>`; }).join("");
  const src = (t.sources || []).map(s => { let h = s.url; try { h = new URL(s.url).hostname; } catch (e) {} return `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || h)}</a>`; }).join("　");
  const aka = (t.aliases || []).length ? `<span class="aka">也叫 ${t.aliases.map(a => hl(a, q)).join("、")}</span>` : "";
  let where = "";
  if (q){ const ci = catIdx[t.category], c = DATA.cats[ci], s = c.sections[t.sec]; where = `<div class="where">${ci + 1} ${esc(c.name)}${s ? ` › ${ci + 1}.${t.sec + 1} ${esc(s.title)}` : ""}</div>`; }
  return `<article class="term" id="${t.id}">${where}
    <div class="head"><h4>${hl(t.name_zh, q)}</h4>${en}${ab}<span class="tier t${t.tier}">${TIER[t.tier] || ""}</span></div>
    <p class="one">${hl(t.one_liner, q)}</p>
    <p class="exp">${esc(t.explanation)}</p>
    ${t.example ? `<p class="ex">${esc(t.example)}</p>` : ""}
    <div class="foot">${aka}${rel ? `<div class="rel">${rel}</div>` : ""}${src ? `<span class="src">来源　${src}</span>` : ""}${t.as_of ? `<span>截至 ${esc(t.as_of)}</span>` : ""}</div>
  </article>`;
}

function catHTML(c, ci, items){
  const bySec = new Map();
  items.forEach(t => { if (!bySec.has(t.sec)) bySec.set(t.sec, []); bySec.get(t.sec).push(t); });
  const secs = [...bySec.keys()].sort((a, b) => a - b);
  const route = secs.map(si => `<li><a href="#s-${c.key}-${si}" data-sec="s-${c.key}-${si}"><span class="sno">${ci + 1}.${si + 1}</span><span class="t">${esc(c.sections[si]?.title || "")}</span><span class="n">${bySec.get(si).length}</span></a></li>`).join("");
  const body = secs.map(si => { const s = c.sections[si] || {}; return `<div class="sec" id="s-${c.key}-${si}"><h3><span class="sno">${ci + 1}.${si + 1}</span>${esc(s.title || "")}</h3>${s.blurb ? `<p class="sec-blurb">${esc(s.blurb)}</p>` : ""}${bySec.get(si).map(t => termHTML(t, "")).join("")}</div>`; }).join("");
  return `<section class="cat" id="cat-${c.key}">
    <div class="cat-head"><span class="cno">${String(ci + 1).padStart(2, "0")}</span><h2>${esc(c.name)}</h2><span class="n">${items.length} 条</span></div>
    <p class="cat-blurb">${esc(c.blurb)}</p>
    ${secs.length > 1 ? `<ol class="route">${route}</ol>` : ""}
    ${body}
  </section>`;
}

function render(){
  document.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
  document.querySelectorAll("[data-tier]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tier === state.tier));
  const q = norm(state.q.trim());
  const tierOK = t => q || state.tier === "all" || t.tier <= Number(state.tier);
  const hit = t => tierOK(t) && (!q || HAY[t.id].includes(q));
  const cc = {all: 0}; DATA.terms.forEach(t => { if (hit(t)) { cc[t.category] = (cc[t.category] || 0) + 1; cc.all++; } });
  document.querySelectorAll("#rail [data-cat] .n").forEach(el => el.textContent = cc[el.parentNode.dataset.cat] || 0);
  $("#tiers").classList.toggle("off", !!q);
  const list = DATA.terms.filter(t => (state.cat === "all" || t.category === state.cat) && hit(t));
  $("#count").textContent = q ? `搜到 ${list.length} 条（全部分级）` : `${list.length} / ${DATA.terms.length}`;
  if (!list.length){ $("#list").innerHTML = `<p class="empty">没有匹配「${esc(state.q)}」的词条。试试英文全称或缩写，或把分类切回「全部」。</p>`; return; }
  let html = "";
  if (q){
    list.sort((a, b) => (NAMEHAY[b.id].includes(q) - NAMEHAY[a.id].includes(q)) || a.tier - b.tier);
    html = `<section class="cat">` + list.map(t => termHTML(t, q)).join("") + `</section>`;
  } else {
    DATA.cats.forEach((c, ci) => { const items = list.filter(t => t.category === c.key); if (items.length) html += catHTML(c, ci, items); });
    if (state.cat !== "all"){
      const ci = catIdx[state.cat], nx = DATA.cats[ci + 1];
      if (nx) html += `<div class="next"><button type="button" class="btn" data-next="${nx.key}"><span class="k">下一类</span><span class="v">${ci + 2} ${esc(nx.name)} →</span></button></div>`;
    }
  }
  $("#list").innerHTML = html;
}

let timer;
$("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; state.q = ""; render(); } });
document.addEventListener("click", e => {
  const nx = e.target.closest("[data-next]"); if (nx) { pickCat(nx.dataset.next); return; }
  const sec = e.target.closest("[data-sec]"); if (sec) { e.preventDefault(); document.getElementById(sec.dataset.sec)?.scrollIntoView(); return; }
  const a = e.target.closest("[data-jump]"); if (!a) return;
  const t = byId[a.dataset.jump]; if (!t) return;
  e.preventDefault();
  if (!document.getElementById(t.id)){ state.cat = t.category; if (state.tier !== "all" && t.tier > Number(state.tier)) state.tier = "all"; state.q = ""; $("#q").value = ""; render(); }
  const el = document.getElementById(t.id); if (el) { document.querySelectorAll(".term.hit").forEach(x => x.classList.remove("hit")); el.classList.add("hit"); el.scrollIntoView(); try { history.replaceState(null, "", "#" + t.id); } catch (err) {} }
});
render();
if (location.hash && byId[location.hash.slice(1)]) { const t = byId[location.hash.slice(1)]; state.cat = t.category; state.tier = "all"; render(); document.getElementById(t.id)?.scrollIntoView(); }
</script>
